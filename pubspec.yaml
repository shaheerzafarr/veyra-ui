name: veyra
description: A local-first prototype for Veyra private messaging.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.4
  file_picker: ^10.3.10
  http: ^1.2.2
  image_picker: ^1.1.2
  mobile_scanner: 7.4.2
  path: ^1.9.0
  path_provider: ^2.1.5
  record: ^6.1.1
  sqflite: ^2.3.3+1
  qr_flutter: 4.1.0
  uuid: ^4.4.0
  web_socket_channel: ^3.0.1
  just_audio: ^0.10.6
  video_player: ^2.14.0
  open_filex: ^4.7.0
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.3
  stream_channel: ^2.1.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/veyra-app-icon.png
