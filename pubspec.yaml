name: veyra
description: A local-first prototype for Veyra private messaging.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  path: ^1.9.0
  sqflite: ^2.3.3+1
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/veyra-app-icon.png
